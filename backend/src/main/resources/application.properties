spring.application.name=boekenwinkel
server.port=8080

# H2-databank in een bestand, zo blijft de data bewaard na een herstart
spring.datasource.url=jdbc:h2:file:./data/boekenwinkel
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# fouten als JSON (ProblemDetail) teruggeven
spring.mvc.problemdetails.enabled=true

# voorbeeldboeken toevoegen bij de eerste opstart
app.seed=true
